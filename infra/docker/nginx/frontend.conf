# Serves the built CRA bundle and proxies /api to the backend container.
# Dropped in as conf.d/default.conf, so nginx's own http{} block (gzip,
# mime.types, logging) applies — only the server block belongs here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Above the backend's own limits; nginx's 1 MiB default is smaller than a
    # legitimate document/image upload and refuses with an nginx HTML page
    # instead of the app's JSON error body.
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml+rss application/atom+xml
               image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # `backend` is the compose service name; 8000 is the port uvicorn listens on
    # inside the network, independent of BACKEND_PORT on the host.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth routes are mounted at /auth, not /api, by app/main.py.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (app/sse/): buffering must stay off or events are held
    # back until the buffer fills, which for a stream is indefinitely.
    location /sse/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
