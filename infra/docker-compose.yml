# Single entry point for the whole stack. Run everything from infra/:
#   cd infra && cp .env.example .env && docker compose up -d --build
#
# backend/ and frontend/ carry no compose or Dockerfile of their own — the
# images are built from infra/docker/*.Dockerfile with the repo root as context.
#
# All ports and credentials come from infra/.env (gitignored; copy from
# infra/.env.example). No literals below, and no container_name, so several
# checkouts can run side by side on one host.
#
# Наружу смотрят только фронтенд и API объектного хранилища. Postgres, Redis и консоль
# MinIO хост-портов не имеют: в сети compose они доступны друг другу по именам сервисов,
# а опубликованный порт на сервере — это открытая в интернет база, если между ней и
# интернетом не встал firewall, о котором никто не вспомнил. Для разработки порты
# возвращает docker-compose.override.yml — compose подхватывает его сам, он в .gitignore,
# и на сервере его просто нет.

name: absolute

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # quay.io и приколотый выпуск. Образы MinIO удалены с Docker Hub, и подвижный latest
  # ровно это и скрывал: пока он тянулся из кэша, всё работало, а на чистой машине стек
  # переставал подниматься по причине, не связанной с кодом.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Только API. Он публичен по назначению: браузер забирает по этому адресу фотографии
    # из открытого бакета (PUBLIC_PHOTO_BASE_URL). Консоль на 9001 — панель управления
    # хранилищем, ей наружу делать нечего; она поднимается локальным override.
    ports:
      - "${MINIO_HOST_PORT}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket the app expects and exits. Without it the first upload
  # fails against a bucket that was never created — MinIO has no
  # MINIO_DEFAULT_BUCKETS, that variable only works in the bitnami image.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
             echo 'bucket ready'"

  backend:
    # Тег по умолчанию — latest, чтобы локальная сборка работала как раньше. На сервере
    # APP_TAG — это sha коммита: развёртывание тянет ровно тот образ, который собрал и
    # проверил прогон, а не пересобирает похожий.
    image: ghcr.io/mm-shkurin/absolute555/backend:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    # Every backend setting lives in infra/.env. app/core/config.py reads the
    # process environment first, so no backend/.env file is needed in the image.
    env_file:
      - .env
    # На петлю, а не на все адреса: снаружи бэкенд доступен через nginx фронтенда,
    # который проксирует /api. Опубликованный наружу порт обходил бы его вместе со
    # всем, что на нём настроено.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The suite, run against the working tree rather than against the image.
  #
  # The mounts are the whole point: the runtime image carries app/ as it was at its last
  # build, so a run without them tests code that may be weeks old and still comes back
  # green. Declared here rather than assembled on the command line because a relative
  # path in a compose file is resolved by compose, while a shell-built absolute path is
  # mangled by MSYS on Windows and silently mounts an empty directory.
  #
  # The profile keeps it out of `docker compose up`; `docker compose run` enables it.
  backend-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/pytest.ini:/app/pytest.ini

  # Same image as backend, different command. Migrations are not re-run here —
  # the backend service owns them.
  worker:
    image: ghcr.io/mm-shkurin/absolute555/backend:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: arq app.worker.WorkerSettings
    # The image's HEALTHCHECK probes http://localhost:8000/health, which only the
    # backend serves. Inherited here it marks a perfectly healthy worker unhealthy, so
    # it is replaced with a check that the worker can still reach its own queue.
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio,arq;from app.queue import queue_settings;asyncio.run(arq.create_pool(queue_settings()))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/mm-shkurin/absolute555/frontend:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        # Пусто — значит тот же источник: nginx внутри образа проксирует /api на backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
