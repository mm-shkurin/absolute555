# Single entry point for the whole stack. Run everything from infra/:
#   cd infra && cp .env.example .env && docker compose up -d --build
#
# backend/ and frontend/ carry no compose or Dockerfile of their own — the
# images are built from infra/docker/*.Dockerfile with the repo root as context.
#
# All ports and credentials come from infra/.env (gitignored; copy from
# infra/.env.example). No literals below, and no container_name, so several
# checkouts can run side by side on one host.

name: absolute

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket the app expects and exits. Without it the first upload
  # fails against a bucket that was never created — MinIO has no
  # MINIO_DEFAULT_BUCKETS, that variable only works in the bitnami image.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
             echo 'bucket ready'"

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    # Every backend setting lives in infra/.env. app/core/config.py reads the
    # process environment first, so no backend/.env file is needed in the image.
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as backend, different command. Migrations are not re-run here —
  # the backend service owns them.
  celery:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.celery_worker.celery_app worker --loglevel=INFO
    # The image's HEALTHCHECK probes http://localhost:8000/health, which only the
    # backend serves. Inherited here it marks a perfectly healthy worker
    # unhealthy, so it is replaced with celery's own ping.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_worker.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
