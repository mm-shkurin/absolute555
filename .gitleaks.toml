# Настройка сканера секретов. Правила берутся стандартные, добавлен только список того,
# что сканировать не надо.
#
# node_modules и venv — чужой код: их README с примером ключа не наш секрет, а шум,
# который приучает пролистывать отчёт. В прогоне их и нет, список нужен, чтобы сканер
# был запускаем локально: `gitleaks dir . --no-banner --redact`.
#
# .env исключён намеренно и только он сам: файл гитигнорен, в нём настоящие секреты, и
# находка в нём — правильная работа сканера, а не проблема. .env.example не исключён:
# вот там появление настоящего ключа поймать надо.
title = "absolute555"

[extend]
useDefault = true

[allowlist]
paths = [
  '''node_modules''',
  '''\.venv''',
  '''venv/''',
  '''coverage/''',
  '''htmlcov/''',
  # Разделитель каталогов и тот и другой: на Windows сканер отдаёт путь с обратным.
  '''infra[\\/]\.env$''',
  '''infra[\\/]\.env\..*''',
  '''package-lock\.json''',
]
