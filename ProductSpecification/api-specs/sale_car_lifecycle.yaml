openapi: 3.0.3
info:
  title: Sale car lifecycle
  version: 1.0.0
  description: |
    Переходы статусов объявления. Каждое действие — отдельный путь: клиент называет
    намерение, а не целевое значение, поэтому недопустимый переход невозможно выразить.

paths:
  /api/v1/sale_car/{sale_car_id}/submit:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Отправить на модерацию (draft -> moderation)
      operationId: submitSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }
        '422':
          description: Объявление неполно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncompleteError' }

  /api/v1/sale_car/{sale_car_id}/withdraw:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Снять с публикации (published -> withdrawn, sold -> withdrawn)
      operationId: withdrawSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }

  /api/v1/sale_car/{sale_car_id}/sold:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Отметить проданным (published -> sold)
      operationId: markSaleCarSold
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }

  /api/v1/sale_car/{sale_car_id}/republish:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Вернуть снятое в продажу (withdrawn -> moderation)
      operationId: republishSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Возврат идёт через модерацию, а не сразу в ленту: между снятием и возвратом
        объявление могли переписать.
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }

  /api/v1/sale_car/{sale_car_id}/revise:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Вернуть отклонённое в черновик (rejected -> draft)
      operationId: reviseSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: Причина отклонения снимается — исправленному объявлению нечего нести.
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }

  /api/v1/sale_car/{sale_car_id}/approve:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Опубликовать после проверки (moderation -> published)
      operationId: approveSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Требует права edit_any_sale_car. Очередь модератора и разбор жалоб — история 9;
        здесь только сам переход, без которого недостижима половина матрицы.
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Недостаточно прав }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }

  /api/v1/sale_car/{sale_car_id}/reject:
    parameters: [{ $ref: '#/components/parameters/SaleCarId' }]
    post:
      summary: Отклонить с причиной (moderation -> rejected)
      operationId: rejectSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Что именно исправить. Отклонение без текста не даёт владельцу зацепки.
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Недостаточно прав }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadTransition' }
        '422': { description: Причина пуста }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    SaleCarId:
      name: sale_car_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Требуется аутентификация
    NotFound:
      description: Объявление не найдено или не принадлежит пользователю
    Transitioned:
      description: Статус изменён
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StatusChanged' }
    BadTransition:
      description: Переход недопустим из текущего статуса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TransitionError' }

  schemas:
    SaleCarStatus:
      type: string
      enum: [draft, moderation, published, rejected, withdrawn, sold]

    StatusChanged:
      type: object
      required: [sale_car_id, status, updated_at]
      properties:
        sale_car_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SaleCarStatus' }
        updated_at: { type: string, format: date-time }

    TransitionError:
      allOf:
        - $ref: 'errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            code: { type: string, enum: [TRANSITION_NOT_ALLOWED] }
            details:
              type: object
              description: Статусы, достижимые из текущего
              properties:
                current_status: { $ref: '#/components/schemas/SaleCarStatus' }
                allowed:
                  type: array
                  items: { $ref: '#/components/schemas/SaleCarStatus' }

    IncompleteError:
      allOf:
        - $ref: 'errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            code: { type: string, enum: [LISTING_INCOMPLETE] }
            details:
              type: object
              properties:
                missing_fields:
                  type: array
                  description: |
                    Все недостающие поля сразу, не первое: мастер подсвечивает шаги.

                    Марки и модели здесь нет с истории 6: редкая марка не должна
                    блокировать публикацию. Объявление уходит на модерацию с сырыми
                    строками из СТС и до решения модератора просто не попадает под
                    фильтр по марке и модели.
                  items:
                    type: string
                    enum: [price, milleage, phone_number, year, photos]
