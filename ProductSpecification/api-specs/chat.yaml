openapi: 3.0.3
info:
  title: Chat between buyer and seller
  version: 1.0.0
  description: |
    Переписка привязана к объявлению и паре участников и заводится вместе с предложением
    по цене. Телефон в чат не подставляется — продавец даёт его сам, если хочет.

    Чужой диалог отвечает «не найдено», а не «запрещено»: запрет подтвердил бы, что
    разговор существует, а вместе с ним — что по объявлению кто-то торгуется.

paths:
  /api/v1/chat/dialogs:
    get:
      summary: Мои диалоги
      operationId: listDialogs
      tags: [chat]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Диалоги, свежие первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dialog' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }

  /api/v1/chat/dialogs/{dialog_id}/messages:
    parameters:
      - { name: dialog_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Лента одного диалога
      operationId: listMessages
      tags: [chat]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Сообщения по возрастанию времени
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404':
          description: Диалога нет, или спрашивающий в нём не участвует.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
    post:
      summary: Написать сообщение
      operationId: sendMessage
      tags: [chat]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404': { $ref: 'errors.yaml#/components/responses/Error' }
        '422':
          description: Пустой текст или длиннее допустимого.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }

  /api/v1/chat/dialogs/{dialog_id}/read:
    post:
      summary: Отметить сообщения прочитанными
      operationId: markRead
      tags: [chat]
      security: [{ bearerAuth: [] }]
      description: |
        Отмечаются только чужие сообщения этого диалога; свои игнорируются молча.
        Повторная отметка не двигает момент прочтения.
      parameters:
        - { name: dialog_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Сколько сообщений стало прочитанными и сколько осталось
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadResult' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404': { $ref: 'errors.yaml#/components/responses/Error' }

  /api/v1/chat/unread:
    get:
      summary: Непрочитанное одним числом
      operationId: unreadCount
      tags: [chat]
      security: [{ bearerAuth: [] }]
      description: |
        Для бейджа в таб-баре. Отдельная ручка, потому что бейдж рисуется на каждом
        экране, а выдача диалогов ради одного числа — страница на каждый переход.
      responses:
        '200':
          description: Число непрочитанных сообщений во всех диалогах
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }

  /api/v1/chat/ws:
    get:
      summary: Живой поток своих диалогов (WebSocket)
      operationId: chatSocket
      tags: [chat]
      description: |
        Не обычный HTTP: соединение поднимается через Upgrade. Токен передаётся
        параметром `token` — заголовков у браузерного WebSocket нет.

        Соединение без токена или с чужим закрывается сразу, а не остаётся открытым и
        немым. Через него приходят только сообщения диалогов подключившегося.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '101':
          description: Соединение установлено
        '403':
          description: Токена нет или он не подходит — соединение закрыто.

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    Dialog:
      type: object
      required: [dialog_id, sale_car_id, unread]
      properties:
        dialog_id: { type: string, format: uuid }
        sale_car_id: { type: string, format: uuid }
        listing: { $ref: 'sale_car_feed.yaml#/components/schemas/FeedCard' }
        counterpart:
          allOf: [{ $ref: 'sale_car_feed.yaml#/components/schemas/Seller' }]
          description: Собеседник — тот из пары, кто не спрашивает.
        last_message: { $ref: '#/components/schemas/Message' }
        unread:
          type: integer
          description: Непрочитанные сообщения собеседника в этом диалоге.

    Message:
      type: object
      required: [message_id, dialog_id, kind, text, created_at]
      properties:
        message_id: { type: string, format: uuid }
        dialog_id: { type: string, format: uuid }
        author_id:
          type: string
          format: uuid
          nullable: true
          description: Пусто у системных строк — их пишет сервер, а не человек.
        kind:
          type: string
          enum: [text, system]
        text: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    MessagePage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    ReadResult:
      type: object
      required: [marked, unread]
      properties:
        marked: { type: integer }
        unread: { type: integer }

    UnreadCount:
      type: object
      required: [unread]
      properties:
        unread: { type: integer }
