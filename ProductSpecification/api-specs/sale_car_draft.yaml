openapi: 3.0.3
info:
  title: Sale car draft
  version: 1.0.0

paths:
  /api/v1/sale_car:
    post:
      summary: Создать пустой черновик объявления
      operationId: createSaleCarDraft
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        description: |
          Чем будет объявление. Без тела — машина в наличии; привоз заводит только
          поставщик, чужая роль получает 403 NOT_AN_IMPORTER (история 17).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftKind' }
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Достигнут лимит черновиков
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftLimitError' }

  /api/v1/sale_car/{sale_car_id}:
    parameters:
      - name: sale_car_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Сохранить любое подмножество полей объявления
      operationId: patchSaleCar
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCarPatch' }
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Объявление заморожено — правка допустима в draft и rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionError' }
    get:
      summary: Одно объявление
      operationId: getSaleCar
      tags: [sale_car]
      responses:
        '200':
          description: Объявление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCar' }
        '404':
          description: |
            Не найдено. Тот же ответ отдаётся на чужое объявление в статусе draft,
            moderation или rejected — 403 подтвердил бы, что оно существует.

  /api/v1/sale_car/user:
    get:
      summary: Свои объявления
      operationId: listMySaleCars
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SaleCarStatus' }
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SaleCar' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: Требуется аутентификация
    NotFound:
      description: Объявление не найдено

  schemas:
    SaleCarStatus:
      type: string
      enum: [draft, moderation, published, rejected, withdrawn, sold]

    SaleCarPatch:
      type: object
      description: Все поля необязательны. Поле status здесь не принимается.
      properties:
        vin: { type: string, nullable: true }
        body_number: { type: string, nullable: true, maxLength: 40 }
        phone_number: { type: string, nullable: true }
        price: { type: number, nullable: true }
        milleage: { type: number, nullable: true }
        # Сырые написания с документа: продавец правит их так же, как остальное.
        mark_raw: { type: string, nullable: true }
        model_raw: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        transmission: { type: string, nullable: true }
        engine_power: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        brand_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Выбор из справочника. Проставленный здесь ключ объявляется выбором
            продавца: распознавание его больше не перетирает, а предложение
            модератору по этому написанию закрывается (история 6).
        model_id: { type: string, format: uuid, nullable: true }
        # Поля привоза правятся так же, как остальные; вид объявления — нет: он выбран
        # при создании, и смена его на живом объявлении означала бы, что покупатель
        # торговался за машину другого канала.
        import_country: { type: string, maxLength: 60, nullable: true }
        delivery_days: { type: integer, minimum: 1, maximum: 365, nullable: true }
        turnkey_price: { type: number, minimum: 0, nullable: true }

    DraftKind:
      type: object
      description: Чем будет объявление. Привоз создаёт только поставщик.
      properties:
        listing_kind: { $ref: '#/components/schemas/ListingKind' }

    ListingKind:
      type: string
      description: |
        Машина в наличии или машина под привоз. Один словарь состояний и одна лента на
        оба вида: покупатель ищет машину, а не канал поставки.
      enum: [stock, import]
      default: stock

    SaleCar:
      type: object
      required: [sale_car_id, user_id, status, created_at, updated_at]
      properties:
        sale_car_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SaleCarStatus' }
        vin: { type: string, nullable: true }
        body_number:
          type: string
          nullable: true
          description: |
            Номер кузова праворульной машины. У неё VIN не выдавали: в строке
            «Идентификационный номер» стоит «ОТСУТСТВУЕТ», а опознаётся она этим номером.
            Заполнено вместо vin, а не вместе с ним.
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        mark_raw: { type: string, nullable: true }
        model_raw: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        transmission: { type: string, nullable: true }
        engine_power: { type: integer, nullable: true }
        price: { type: number, nullable: true }
        milleage: { type: number, nullable: true }
        phone_number:
          type: string
          nullable: true
          description: |
            Только владельцу и модератору. Всем остальным null, пока они не спросят
            телефон явно — POST /sale_car/{id}/reveal-phone (история 8).
        seller:
          allOf: [{ $ref: 'sale_car_feed.yaml#/components/schemas/Seller' }]
          nullable: true
          description: |
            Кто продаёт: имя и аватар. Рейтинг и число сделок приезжают с историей 12.
        description: { type: string, nullable: true }
        task_id:
          type: string
          nullable: true
          description: Задача чтения СТС, поставленная в очередь при загрузке снимка.
        task_status:
          type: string
          nullable: true
          description: |
            Словарь очереди, а не то, что показывают продавцу: для экрана есть
            autofill.state (история 6).
        listing_kind: { $ref: '#/components/schemas/ListingKind' }
        import_country:
          type: string
          nullable: true
          description: Откуда везут. Только у привоза (история 17).
        delivery_days:
          type: integer
          nullable: true
          description: Срок доставки в днях. Только у привоза.
        turnkey_price:
          type: number
          nullable: true
          description: |
            Цена под ключ — с доставкой, растаможкой и оформлением. Стоит рядом с ценой,
            а не вместо неё: покупатель сравнивает машины по цене, а платит эту.
        preview_photo_url:
          type: string
          nullable: true
          description: Обложка — превью первой фотографии галереи.
        thickness:
          allOf: [{ $ref: 'sale_car_thickness.yaml#/components/schemas/ThicknessSummary' }]
          nullable: true
          description: |
            Сводка карты замеров (история 14). `null` — замеров нет вовсе.
        photos:
          type: array
          description: |
            В порядке показа, первый — обложка. Заменяет прежний photo_urls, который
            порядка не выражал (история 5).
          items: { $ref: 'sale_car_photos.yaml#/components/schemas/Photo' }
        reject_reason:
          type: string
          nullable: true
          description: Текст модератора. Заполнен только в статусе rejected
        reject_label:
          allOf: [{ $ref: 'moderation.yaml#/components/schemas/RejectionLabel' }]
          nullable: true
          description: |
            За что вернули, из пяти ярлыков. Обязателен при отклонении, в отличие от
            текста (история 9).
        autofill:
          allOf: [{ $ref: 'sale_car_sts.yaml#/components/schemas/Autofill' }]
          description: |
            Исход распознавания СТС и источник марки и модели. Повторяет то, что
            приезжает по SSE, чтобы перезагрузка страницы не теряла исход.
        moderation:
          allOf: [{ $ref: '#/components/schemas/Moderation' }]
          description: |
            Что с объявлением сделал модератор. Приходит владельцу и модератору;
            в публичной карточке ленты блока нет вовсе.
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Moderation:
      type: object
      description: |
        Последнее решение модератора по объявлению. Строка помнит только его: одобрено —
        отклонено — снова одобрено складывается в один момент. История решений — предмет
        админки, не этой выдачи.
      required: [decided_at, decided_by]
      properties:
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Момент последнего решения. null, пока решения не было.
        decided_by:
          allOf: [{ $ref: '#/components/schemas/Moderator' }]
          nullable: true
          description: |
            Кто решил. Заполнено только для модератора: владелец видит, когда решили и
            за что вернули, но не кем — имя сотрудника в его выдаче это адрес, по
            которому ему пишут лично про своё объявление.

    Moderator:
      type: object
      required: [user_id, name]
      properties:
        user_id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Имя из провайдера, которым сотрудник вошёл.

    DraftLimitError:
      allOf:
        - $ref: 'errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            code: { type: string, enum: [DRAFT_LIMIT_REACHED] }
            details:
              type: object
              properties:
                limit: { type: integer, example: 5 }

    TransitionError:
      allOf:
        - $ref: 'errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            code: { type: string, enum: [TRANSITION_NOT_ALLOWED, LISTING_FROZEN] }
            details:
              type: object
              properties:
                current_status: { $ref: '#/components/schemas/SaleCarStatus' }
                allowed:
                  type: array
                  items: { $ref: '#/components/schemas/SaleCarStatus' }
