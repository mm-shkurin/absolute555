openapi: 3.0.3
info:
  title: Sale car registration document
  version: 1.0.0
  description: |
    Снимок СТС — документ, а не витрина: VIN, серия и номер. Он лежит в закрытом бакете,
    отдельном от галереи, и наружу уходит только подписанной ссылкой с коротким сроком.

    Политика задана на бакете, а не на объекте, потому что опечатка в префиксе внутри
    одного бакета выставляет документ наружу молча, а промах бакетом виден сразу.

paths:
  /api/v1/sale_car/{sale_car_id}/sts:
    parameters:
      - name: sale_car_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Приложить снимок СТС к черновику и запустить распознавание
      operationId: uploadSaleCarSts
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Первый шаг мастера продажи — фотография документа и ничего больше. Цены,
        телефона и пробега на этом шаге ещё нет, поэтому ручка их и не спрашивает:
        черновик уже создан POST /api/v1/sale_car.

        Ответ приходит сразу, до распознавания: читает фон, а не запрос. Исход
        приезжает по SSE и повторяется полем autofill в выдаче объявления.

        Повторная загрузка заменяет снимок и перезапускает распознавание. То, что
        продавец успел поправить руками, распознавание не трогает.

        Разрешено в draft и rejected — там же, где разрешена правка полей.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Снимок СТС. Уходит в закрытый бакет, не в галерею.
      responses:
        '202':
          description: Снимок принят, распознавание поставлено в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StsAccepted' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404':
          description: Объявление не найдено или принадлежит другому пользователю.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
        '409':
          description: |
            Статус объявления не допускает правки — снимок принимается только в draft
            и rejected.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
    get:
      summary: Подписанная ссылка на снимок СТС
      operationId: getSaleCarStsLink
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Отдаётся ссылка, а не файл: сам файл пойдёт из хранилища напрямую, минуя воркер.

        Владельцу и модератору. Чужому — 404, тот же ответ, что на неопубликованное
        объявление: 403 подтвердил бы, что документ существует.

        Ссылка живёт минуты, не часы. Она попадёт в историю браузера и в реферер, и её
        срок — единственное, что ограничивает утечку по пересланной ссылке.
      responses:
        '200':
          description: Ссылка и момент, когда она перестанет работать
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StsLink' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404':
          description: |
            Объявление не найдено, снимок уже удалён после решения модератора, или
            вызывающий не владелец и не модератор — все три неотличимы снаружи.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }

  /api/v1/sale_car/{sale_car_id}/vin:
    parameters:
      - name: sale_car_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Распознать машину по VIN, вписанному продавцом
      operationId: decodeSaleCarVin
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Второй вход в то же распознавание. Снимок СТС прочитан, а VIN в нём — нет:
        продавец вписывает семнадцать символов сам, и по ним подтягиваются марка,
        модель, год и характеристики.

        Форма ответа та же, что у снимка: принято сразу, исход приезжает по SSE и
        повторяется полем autofill в выдаче объявления. Экран поэтому не различает,
        чем распознавание было запущено.

        Вписанный VIN сохраняется в объявлении как значение продавца: повторное
        распознавание его не перетирает.

        Разрешено в draft и rejected — там же, где разрешена правка полей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vin]
              properties:
                vin:
                  type: string
                  minLength: 17
                  maxLength: 17
                  description: Семнадцать символов из документа.
      responses:
        '202':
          description: VIN принят, распознавание поставлено в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StsAccepted' }
        '400':
          description: VIN не похож на VIN — длина не семнадцать символов.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404':
          description: Объявление не найдено или принадлежит другому пользователю.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
        '409':
          description: |
            Статус объявления не допускает правки — VIN принимается только в draft
            и rejected.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }

  /api/v1/sale_car/{sale_car_id}/decode-vin:
    parameters:
      - name: sale_car_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Распознать характеристики по VIN, который вписал продавец
      operationId: decodeSaleCarVin
      tags: [sale_car]
      security: [{ bearerAuth: [] }]
      description: |
        Второй вход в то же распознавание. Первый — снимок СТС; этот нужен там, где
        снимок прочитали, а идентификационный номер из него не разобрали
        (autofill.state = undecoded): продавец переписывает VIN из документа руками, и
        распознавать надо по нему.

        Отдельная ручка, а не PATCH объявления с побочным эффектом: правка полей и
        запуск фоновой задачи — разные действия, и «сохранил VIN» не должно молча
        означать «запустил задачу».

        Форма ответа та же, что у снимка: 202, задача в очереди, исход приезжает по SSE
        /api/v1/task/sse/{sale_car_id} и повторяется полем autofill в выдаче
        объявления.

        Вписанный VIN — выбор продавца, и распознавание его не перетирает: задача
        читает по нему характеристики, но сам номер оставляет как есть.

        Исходы прежние: pending, undecoded, done. unreadable здесь невозможен по
        построению — читать нечего, снимка нет; VIN, по которому машина не нашлась, —
        это undecoded.

        Разрешено в draft и rejected — там же, где разрешена правка полей.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinDecodeRequest' }
      responses:
        '202':
          description: VIN принят, распознавание поставлено в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StsAccepted' }
        '401': { $ref: 'errors.yaml#/components/responses/Error' }
        '404':
          description: Объявление не найдено или принадлежит другому пользователю.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
        '409':
          description: |
            Статус объявления не допускает правки — VIN принимается только в draft
            и rejected.
          content:
            application/json:
              schema: { $ref: 'errors.yaml#/components/schemas/Error' }
        '422':
          description: |
            Строка не похожа на VIN. Проверяется до постановки задачи: молчаливая
            задача, которая через минуту вернёт undecoded, ничего продавцу не говорит.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VinMalformedError' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    StsAccepted:
      type: object
      required: [sale_car_id, autofill]
      properties:
        sale_car_id: { type: string, format: uuid }
        autofill: { $ref: '#/components/schemas/Autofill' }

    AutofillState:
      type: string
      description: |
        Исход распознавания снимка, каким его видит продавец.

        none — снимка нет; pending — читаем; unreadable — фото не прочитали, чинится
        новым снимком; undecoded — фото прочли, данные не разобрали, чинится ручным
        вводом; done — подставили.

        unreadable и undecoded разделены намеренно: подсказка на экране у них разная, а
        в логах эта разница уже есть и без выдачи.
      enum: [none, pending, unreadable, undecoded, done]

    FieldSource:
      type: string
      description: |
        Откуда в поле приехало значение. seller побеждает всегда: повторное
        распознавание не перетирает то, что человек уже исправил, и правка закрывает
        предложение модератору по этому написанию.
      enum: [ocr, seller]

    Autofill:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/AutofillState' }
        brand_source:
          allOf: [{ $ref: '#/components/schemas/FieldSource' }]
          nullable: true
          description: null, пока марка не заполнена ни распознаванием, ни продавцом.
        model_source:
          allOf: [{ $ref: '#/components/schemas/FieldSource' }]
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Когда исход в последний раз менялся.

    VinDecodeRequest:
      type: object
      required: [vin]
      properties:
        vin:
          type: string
          description: |
            Семнадцать символов по ISO 3779: латиница и цифры, без букв I, O и Q —
            их исключили из стандарта, чтобы не путать с единицей и нулём. Пробелы и
            дефисы отбрасываются, регистр приводится к верхнему.
          example: XTA210740A1234567
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'

    VinMalformedError:
      allOf:
        - $ref: 'errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            code: { type: string, enum: [VIN_MALFORMED] }
            details:
              type: object
              properties:
                vin: { type: string, description: Строка, как её прислали. }

    StsLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: Подписанная ссылка в закрытый бакет.
        expires_at:
          type: string
          format: date-time
          description: После этого момента ссылка не работает.
