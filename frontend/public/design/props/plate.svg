<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 132" width="280" height="132">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E3F2"/>
    </linearGradient>
  </defs>
  <!-- Поворот вокруг центра холста; поля холста рассчитаны так, чтобы углы повёрнутого
       знака в них помещались — иначе SVG обрежет их сам, ещё до вёрстки. -->
  <g transform="rotate(-10 140 66)">
    <rect x="18" y="33" width="244" height="72" rx="12" fill="#0D141F" opacity=".18"/>
    <rect x="16" y="29" width="244" height="72" rx="12" fill="url(#pl)" stroke="#0D141F" stroke-width="3"/>
    <text x="122" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="41" font-weight="700" fill="#0D141F">А555АА</text>
    <path d="M206 29 v72" stroke="#0D141F" stroke-width="2" opacity=".35"/>
    <text x="233" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="20" font-weight="700" fill="#0D141F">55</text>
    <text x="233" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="12" font-weight="700" fill="#0066FF">RUS</text>
  </g>
</svg>
