# Правила репозитория и контракт API. Быстрый прогон без зависимостей: только чтение
# исходников, минута целиком.
name: rules

# Включая ветки в работе. Возражение «там код меняется каждые несколько минут» снимает
# concurrency ниже: десять пушей подряд гасят друг друга и остаётся один прогон,
# последний. Проверка после слияния находит поломку, когда автор уже занят другим, и
# красит ветку всем остальным, а не тому, кто её сломал.
# Токен прогона: только чтение исходников. Дефолт репозитория может быть шире, и тогда
# любой шаг — включая чужой action — получает право писать в репозиторий, не нуждаясь в
# нём. Шире выдаётся точечно на job: так это видно в том же файле.
permissions:
  contents: read


  push:
    branches: [dev, main, 'features/**']
  workflow_dispatch:

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: правила и контракт
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # Лимит длины файла и направление зависимостей. Правила читаются из того же
      # config.json, что и человеком, а известные нарушения — из baseline: гейт ловит
      # новые, а не заставляет чинить накопленное одним заходом.
      - name: Правила репозитория
        run: python scripts/check_repo_rules.py

      # Что зовёт фронтенд против того, что описано в ProductSpecification/api-specs.
      # Главный риск проекта прямо сейчас: две стороны расходятся молча.
      - name: Контракт API
        run: python scripts/check_api_contract.py
