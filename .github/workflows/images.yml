# Образы приложения: собираются один раз на коммит и кладутся в GHCR под его sha.
#
# Один раз — потому что всё дальше работает с этой сборкой, а не с похожей: `stack`
# гоняет по ней живые сценарии, `release` разворачивает её же. Раньше образ собирался
# в каждом прогоне свой, и в прод уходила сборка, по которой ни один сценарий не шёл.
name: images

# Токен прогона: только чтение исходников. Шире выдаётся точечно на job.
permissions:
  contents: read

on:
  push:
    branches: [dev, main, 'features/**']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: образ ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Только тег sha. `latest` ставит release после проверок: иначе им становилась бы
      # любая ветка в работе, которую запушили последней.
      - name: Сборка и публикация
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          # Свежий базовый образ: из кэша слоёв он приезжал бы с исправлениями месячной
          # давности, и сканер ниже краснел бы на уже исправленном.
          pull: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Бинарник по версии и контрольной сумме, а не trivy-action по тегу: в марте 2026
      # теги trivy-action переписали на вредоносный код. Сумма взята из checksums
      # выпуска и сверена со скачанным файлом.
      - name: Установить trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy

      # Только исправимые HIGH и CRITICAL: неисправленную уязвимость автор коммита
      # закрыть не может, и гейт на неё выключили бы первым делом.
      - name: Уязвимости образа
        run: >-
          ./trivy image --no-progress --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

      # Состав образа на момент сборки: когда выйдет новая уязвимость, вопрос «а у нас
      # она есть» решается поиском по файлу, а не пересборкой старого коммита.
      - name: SBOM
        if: always()
        run: >-
          ./trivy image --no-progress --format cyclonedx --output sbom.json
          ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-${{ matrix.image }}
          path: sbom.json
          retention-days: 90
