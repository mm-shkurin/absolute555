# Фронтенд: типы, правила, границы модулей, юниты, сборка и браузерные сценарии.
#
# Отдельно от бэкенда намеренно: у них разные среды, разное время прогона и разные причины
# краснеть. Общий workflow заставлял бы правку кнопки ждать поднятия Postgres.
name: frontend

# Токен прогона: только чтение исходников. Дефолт репозитория может быть шире, и тогда
# любой шаг — включая чужой action — получает право писать в репозиторий, не нуждаясь в
# нём. Шире выдаётся точечно на job: так это видно в том же файле.
permissions:
  contents: read

on:
  push:
    branches: [dev, main, 'features/**']
    paths:
      - 'frontend/**'
      - 'infra/docker/frontend.Dockerfile'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: типы, правила, юниты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, а не `install`: ставит ровно то, что в lock-файле, и падает, если
      # package.json и lock разошлись — расхождение должно ловиться здесь, а не у того,
      # кто следующим склонирует репозиторий.
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      # Внутри линта живёт и гейт границ модулей: фича не имеет права импортировать фичу.
      - name: Правила и границы
        run: npm run lint

      # С замером: цифра нужна не на каждом круге разработчика, но на общем прогоне она
      # стоит секунды, а без неё покрытие узнаётся только тогда, когда кто-то специально
      # спросит — то есть никогда.
      - name: Юнит-тесты и покрытие
        run: npx vitest run --coverage

      - name: Сборка
        run: npm run build

      # Артефакт сборки — не для деплоя, а для разбора: «у меня локально собирается»
      # проверяется скачиванием того, что собралось здесь.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  image:
    name: сборка образа
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Образ собирается из репозитория целиком: Dockerfile берёт контекстом корень.
      # Проверка нужна отдельно от `npm run build` — образ ломается своими способами,
      # от версии node в базовом слое до пути, по которому лежит собранный бандл.
      - name: Сборка frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  browser:
    name: браузерные сценарии
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chrome предустановлен на ubuntu-latest, драйвер к нему Selenium Manager
      # скачивает сам — отдельного chromedriver в зависимостях нет намеренно.
      - name: Версия браузера
        run: google-chrome --version

      # Сценарии идут против дев-заглушки: сервер поднимает сам прогон, бэкенд не нужен.
      - name: Сценарии
        run: npm run test:e2e
        env:
          CI: 'true'
