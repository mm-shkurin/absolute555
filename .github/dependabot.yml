version: 2
updates:
  # Actions приколоты по sha, а не по подвижному мажорному тегу: тег переносится, и
  # компрометация чужого репозитория выполняет чужой код в прогоне, который имеет право
  # писать в реестр образов. Обратная сторона пина — он не обновляется сам; это и делает
  # Dependabot, присылая правку с новым sha, которую видно в диффе.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
